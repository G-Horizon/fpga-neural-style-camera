<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Ti60 · 风格相机</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <aside id="portrait" class="orientation-notice" aria-live="polite"><span aria-hidden="true">↻</span><h1>请将手机转回竖屏</h1><p>保持画面比例，在下方查看实时信息。</p></aside>
  <main class="viewer">
    <header><div><p class="eyebrow">TI60 / STYLE CAMERA</p><h1>让此刻，成为画作。</h1></div><span class="tag">实时观看</span></header>
    <section class="screen" aria-label="实时风格画面">
      <canvas id="view" width="1280" height="720" aria-label="1280×720 实时风格画面"></canvas>
      <div id="notice">正在连接相机…</div>
      <div class="screen-caption"><span id="sourceLabel">FPGA 风格画面</span><span>1280 × 720</span></div>
    </section>
    <section class="connection"><span class="dot" aria-hidden="true"></span><span id="status" role="status">连接中</span></section>
    <section class="metrics" id="fps" aria-label="实时帧率">
      <article><span>实际接收画面</span><strong id="networkFps">—</strong><small> FPS</small></article>
      <article><span>摄像头源帧率</span><strong id="sourceFps">—</strong><small> FPS</small></article>
    </section>
    <section class="details"><h2>画面信息</h2><dl>
      <div><dt>当前风格</dt><dd id="style">等待画面</dd></div>
      <div><dt>风格图像</dt><dd>256 × 144</dd></div>
      <div><dt>手机显示</dt><dd>1280 × 720 · 16:9</dd></div>
      <div><dt>画面处理</dt><dd>双线性放大 · 无细节融合</dd></div>
      <div><dt>已接收新画面</dt><dd id="receivedFrames">0</dd></div>
    </dl></section>
    <nav aria-label="观看控制"><button id="connect">重新连接</button><button id="fullscreen">全屏观看</button><label><input id="fpsToggle" type="checkbox" checked>显示帧率</label></nav>
    <p class="note">风格由 FPGA 生成，手机仅放大显示。接收帧率按到达的新画面统计，与摄像头采集速度分别显示；屏幕刷新不计为新画面。</p>
  </main>
  <script type="module" src="/app.mjs"></script>
</body>
</html>
